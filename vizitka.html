<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digitálna vizitka</title>
<style>
  :root{
    --accent:#ED1C24;
    --accent-dark:#B4141A;
    --ink:#1A1A1A;
    --paper:#FAFAF8;
    --panel:#FFFFFF;
    --line:#E7E5E1;
    --muted:#767370;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:24px;
  }
  .card{
    width:100%;
    max-width:360px;
    background:var(--panel);
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.25);
  }
  .hero{
    background:var(--accent);
    padding:44px 20px 46px;
    text-align:center;
    color:#fff;
    position:relative;
  }
  .hero-favicon{
    position:absolute;
    top:16px;
    right:16px;
    width:34px;
    height:34px;
    opacity:0.35;
    object-fit:contain;
  }
  .avatar{
    width:88px;
    height:88px;
    border-radius:50%;
    background:rgba(255,255,255,0.25);
    border:3px solid #fff;
    margin:0 auto 14px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:700;
    color:#fff;
  }
  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .name{
    font-size:22px;
    font-weight:700;
    margin:0 0 2px;
  }
  .role{
    font-size:14px;
    opacity:.9;
    margin:0;
  }
  .icon-row{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-top:-22px;
    position:relative;
    z-index:5;
  }
  .icon-circle{
    width:44px;
    height:44px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.12);
    color:var(--accent);
    text-decoration:none;
    border:none;
    cursor:pointer;
  }
  .body{
    padding:26px 22px 8px;
  }
  .row{
    display:flex;
    gap:12px;
    align-items:flex-start;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{ border-bottom:none; }
  .row-icon{
    width:28px;
    height:28px;
    border-radius:50%;
    background:#FBEAEA;
    color:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    margin-top:1px;
  }
  .row-text .l{
    font-size:10.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.05em;
    margin-bottom:2px;
  }
  .row-text .v{
    font-size:14px;
    font-weight:500;
    word-break:break-word;
  }
  .save-btn{
    display:block;
    width:calc(100% - 44px);
    margin:16px 22px 22px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:15px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
  }
  .save-btn:hover{ background:var(--accent-dark); }
  .logo-footer{
    padding:16px 22px 26px;
    text-align:center;
    border-top:1px solid var(--line);
  }
  .logo-footer img{
    max-width:110px;
    max-height:34px;
    object-fit:contain;
  }
  .empty-state{
    text-align:center;
    color:var(--muted);
    padding:40px 20px;
    font-size:14px;
  }
</style>
</head>

  let s = (first[0]||'') + (last[0]||'');
  return s.toUpperCase() || '?';
}

const first = qp('meno');
const last = qp('priezvisko');
const role = qp('pozicia');
const company = qp('firma');
const email = qp('email');
const phone = qp('telefon');
const website = qp('web');
const linkedin = qp('linkedin');
const street = qp('ulica');
const streetNum = qp('cislo');
const zip = qp('psc');
const city = qp('mesto');
const country = qp('krajina');
const color = qp('farba') === 'siva' ? '#58595B' : '#ED1C24';

const card = document.getElementById('card');

if(!first && !last && !email && !phone){
  card.innerHTML = '<div class="empty-state">Táto vizitka nemá žiadne údaje. Skontroluj odkaz.</div>';
} else {
  const fullName = [first, last].filter(Boolean).join(' ');
  const roleCompany = [role, company].filter(Boolean).join(' · ');

  let icons = '';
  if(phone) icons += `<a class="icon-circle" href="tel:${escapeHtml(phone)}">${ICONS.phone}</a>`;
  if(email) icons += `<a class="icon-circle" href="mailto:${escapeHtml(email)}">${ICONS.mail}</a>`;
  const addrParts = [];
  if(street || streetNum) addrParts.push([street, streetNum].filter(Boolean).join(' '));
  if(zip || city) addrParts.push([zip, city].filter(Boolean).join(' '));
  if(country) addrParts.push(country);
  const addrFull = addrParts.join(', ');
  if(addrFull) icons += `<a class="icon-circle" href="https://maps.google.com/?q=${encodeURIComponent(addrFull)}" target="_blank">${ICONS.pin}</a>`;
  if(linkedin){
    let lUrl = linkedin;
    if(!/^https?:\/\//i.test(lUrl)) lUrl = 'https://' + lUrl;
    icons += `<a class="icon-circle" href="${escapeHtml(lUrl)}" target="_blank">${ICONS.linkedin}</a>`;
  }

  let rows = '';
  if(phone) rows += rowHtml(ICONS.phone, 'Telefón', phone);
  if(email) rows += rowHtml(ICONS.mail, 'Email', email);
  if(website) rows += rowHtml(ICONS.globe, 'Web', website);
  if(addrFull) rows += rowHtml(ICONS.pin, 'Adresa', addrFull);

  card.innerHTML = `
    <div class="hero" style="background:${color}">
      ${FAVICON_B64 ? `<img class="hero-favicon" src="data:image/png;base64,${FAVICON_B64}" alt="">` : ''}
      <div class="avatar">${initials(first, last)}</div>
      <p class="name">${escapeHtml(fullName || 'Meno')}</p>
      ${roleCompany ? `<p class="role">${escapeHtml(roleCompany)}</p>` : ''}
    </div>
    ${icons ? `<div class="icon-row">${icons}</div>` : ''}
    <div class="body">${rows}</div>
    <button class="save-btn" style="background:${color}" onclick="downloadVCF()">Uložiť kontakt</button>
    ${LOGO_B64 ? `<div class="logo-footer"><img src="data:image/png;base64,${LOGO_B64}" alt="logo"></div>` : ''}
  `;
}

function rowHtml(icon, label, value){
  return `<div class="row"><div class="row-icon">${icon}</div><div class="row-text"><div class="l">${label}</div><div class="v">${escapeHtml(value)}</div></div></div>`;
}

function downloadVCF(){
  let lines = ['BEGIN:VCARD', 'VERSION:3.0'];
  lines.push(`N:${last};${first};;;`);
  lines.push(`FN:${[first, last].filter(Boolean).join(' ')}`);
  if(company) lines.push(`ORG:${company}`);
  if(role) lines.push(`TITLE:${role}`);
  if(phone) lines.push(`TEL;TYPE=CELL:${phone}`);
  if(email) lines.push(`EMAIL:${email}`);
  if(street || streetNum || zip || city || country){
    const streetFull = [street, streetNum].filter(Boolean).join(' ');
    lines.push(`ADR;TYPE=WORK:;;${streetFull};${city};;${zip};${country}`);
  }
  if(website){
    let wurl = website;
    if(!/^https?:\/\//i.test(wurl)) wurl = 'https://' + wurl;
    lines.push(`URL;TYPE=WORK:${wurl}`);
  }
  if(linkedin){
    let lUrl = linkedin;
    if(!/^https?:\/\//i.test(lUrl)) lUrl = 'https://' + lUrl;
    lines.push(`URL;TYPE=LinkedIn:${lUrl}`);
  }
  lines.push('END:VCARD');
  const vcf = lines.join('\r\n');

  const blob = new Blob([vcf], {type: 'text/vcard;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const filename = [first, last].filter(Boolean).join('_') + '.vcf';
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
